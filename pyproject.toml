[project]
name = "research-atlas"
version = "0.1.0"
description = "Generative UI research exploration using MCP, OpenAlex, and PubMed"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastmcp[apps]>=4,<5",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "pydantic-ai-slim[openai]>=2.51,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
